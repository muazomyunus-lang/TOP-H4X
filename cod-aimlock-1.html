body {

    color: white;

.container {

}

.card {
    background: #101010;
    border: 1px solid #222;
    border-radius: 18px;
    padding: 20px;
    margin-bottom: 18px;
    box-shadow: 0 0 20px rgba(0,255,136,.08);
}

label {
    display: block;
    margin-bottom: 8px;
    font-weight: bold;
}

input,
select {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: 1px solid #333;
    background: #181818;
    color: white;
    outline: none;
    margin-bottom: 15px;
}

input:focus,
select:focus {
    border-color: #00ff88;
}

button {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 10px;
    background: #00ff88;
    color: #000;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    filter: brightness(1.1);
}

.result {
    display: none;
}

.result h2 {
    color: #00ff88;
    text-align: center;
}

.device-name {
    text-align: center;
    color: #ddd;
    margin-bottom: 18px;
}

.mode-title {
    color: #00ff88;
    font-size: 21px;
    margin-bottom: 15px;
}

.sensi-row {
    display: flex;
    justify-content: space-between;
    padding: 11px 0;
    border-bottom: 1px solid #252525;
}

.sensi-row:last-child {

}

.value {
    color: #00ff88;
    font-weight: bold;
}

.note {
    color: #888;
    font-size: 12px;
    text-align: center;
    margin-top: 18px;

<script>

function getDeviceType(device) {

    const name = device.toLowerCase();

    if (
        name.includes("iphone") ||
        name.includes("ipad")
    ) {
        return "iphone";
    }

    if (
        name.includes("rog") ||
        name.includes("redmagic") ||
        name.includes("nubia")
    ) {
        return "gaming";
    }

    if (
        name.includes("s24") ||
        name.includes("s23") ||
        name.includes("s22") ||
        name.includes("s21") ||
        name.includes("s20")
    ) {
        return "flagship";
    }

    if (
        name.includes("a55") ||
        name.includes("a54") ||
        name.includes("a35") ||
        name.includes("a25") ||
        name.includes("a15")
    ) {
        return "midrange";
    }

    if (
        name.includes("itel") ||
        name.includes("smart") ||
        name.includes("a60") ||
        name.includes("a70")
    ) {
        return "entry";
    }

    return "android";
}


/*

function generateSensi() {

    const device =
        document.getElementById("device").value.trim();

    const mode =
        document.getElementById("mode").value;

    if (!device) {

        alert("Enter your phone model first.");

        return;
    }

    const type = getDeviceType(device);

    const settings =
        presets[type][mode];

    document.getElementById("result").style.display = "block";

    document.getElementById("deviceOutput").innerText =
        "DEVICE: " + device;

    document.getElementById("modeOutput").innerText =
        mode === "mp"
        ? "⚡ MULTIPLAYER — SHARP TRACKING"
        : "🎯 BATTLE ROYALE — PRECISION TRACKING";

    let html = "";

    for (const setting in settings) {

        html += `
            <div class="sensi-row">
                <span>${setting}</span>
                <span class="value">${settings[setting]}</span>
            </div>
        `;
    }

    document.getElementById("settings").innerHTML = html;

    document.getElementById("result")
        .scrollIntoView({
            behavior: "smooth"
        });
}
